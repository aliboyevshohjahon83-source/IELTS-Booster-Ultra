o‘limiga yozing; 1-3-7 kun takror."}],"c":null,"q":[],"v":2},"12_6":{"r":[{"id":"analysis","title":"Mock tahlili","minutes":60,"detail":"Har xatoga harf, sabab va qoida yozing (Xatolar bo‘limi)."},{"id":"paraphrase","title":"Paraphrase ishi","minutes":25,"detail":"Passage’larni javob kaliti bilan qayta o‘qing. Eng muhim 15–20 juftlikni jadvalga va Anki’ga o‘tkazing."},{"id":"vocab","title":"Lug‘at (Anki)","minutes":15,"detail":"8–10 yangi so‘z, qolgani takrorlash. Avval eslang, keyin javobni oching."}],"w":[{"id":"mock","title":"Task 1 (20) + Task 2 (40)","minutes":60,"detail":"Imtihon sharoitida, yangi savollar, taymer bilan."},{"id":"self-score","title":"O‘z bahongiz (AI dan OLDIN)","minutes":10,"detail":"4 mezon bo‘yicha band qo‘ying (kalibrovka)."},{"id":"mock-feedback","title":"AI feedback + Mock bo‘limiga yozing","minutes":10,"detail":"Natijani Mock bo‘limiga kiriting."}],"s":[{"id":"speak-0","title":"Full mock","minutes":14,"detail":"Part 1 (4–5 daq) → Part 2 (3–4) → Part 3 (4–5). Yozib oling, to‘xtamang. Mavzu: Celebrations and gifts."},{"id":"speak-1","title":"Tahlil","minutes":30,"detail":"Transkript → 4 mezon bo‘yicha ball (descriptordan dalil bilan) → «Natija» bo‘limida KPI kiriting."},{"id":"speak-2","title":"Tuzatish","minutes":30,"detail":"Eng zaif Part 2 va Part 3 javobingizni qayta ishlab, qayta yozib oling."},{"id":"speak-3","title":"Keyingi hafta","minutes":10,"detail":"Top-3 ustuvorlik va keyingi hafta mavzularini belgilang."},{"id":"speak-4","title":"Bufer","minutes":6,"detail":"Dam oling yoki orqada qolgan ishni bajaring."}],"c":"Describe a gift you gave or received.","q":["Do you like giving gifts?","How do you celebrate your birthday?","Are gifts becoming too commercial?","How does weather affect mood?"],"v":3}},"packs":[{"t":"How students remember more","p":"A group of teachers replaced one long weekly vocabulary test with short reviews spread across the week. Students first tried to recall each word without looking at their notes, then checked their answers. At the end of the term, the group using short reviews remembered more words than the group that reread the same list once. The teachers did not increase total study time. They changed when students practised and asked them to retrieve information from memory. The result suggests that effortful recall, repeated after a gap, can make learning last longer than simply seeing information again.","q":[{"prompt":"What change did the teachers make?","choices":["They added more study hours.","They replaced one long test with short spaced reviews.","They stopped teaching vocabulary.","They asked students to copy every word."],"answer":1,"explanation":"O‘qituvchilar umumiy vaqtni oshirmadi; haftalik bitta test o‘rniga qisqa takrorlashlar qo‘shdi."},{"prompt":"Which group remembered more vocabulary at term’s end?","choices":["The group that used short reviews.","The group that studied only on weekends.","Both groups remembered exactly the same amount.","The group that copied the list."],"answer":0,"explanation":"Matnda qisqa, oraliq bilan qilingan review guruhi ko‘proq so‘zni eslab qolgani aytilgan."},{"prompt":"In this passage, “retrieve” means to…","choices":["translate a word into another language.","recall information from memory.","write a longer definition.","remove information from notes."],"answer":1,"explanation":"“Retrieve information from memory” — ma’lumotni xotiradan eslab chiqarish."}]},{"t":"Recommendations and choice","p":"Online services often suggest music, news or products based on what a person viewed before. These recommendations can save time, especially when a catalogue is large. However, researchers found that people sometimes stopped exploring after several suggestions matched their usual interests. One library tested a different approach: its website kept familiar recommendations but also displayed a small section called “something different”. Visitors could ignore it or open it. Many chose the extra section when it was visible, although not everyone liked every result. The trial showed that design can preserve convenience while still making discovery possible.","q":[{"prompt":"What is one benefit of online recommendations?","choices":["They remove every advertisement.","They can save time in a large catalogue.","They guarantee that every suggestion is useful.","They prevent people from choosing."],"answer":1,"explanation":"Birinchi qismda tavsiyalar katta katalogdan tezroq tanlashga yordam berishi aytilgan."},{"prompt":"What did the library add to its website?","choices":["A section with unfamiliar suggestions.","A rule requiring users to buy a book.","A list of only popular items.","A limit on browsing time."],"answer":0,"explanation":"Kutubxona odatiy tavsiyalarga qo‘shimcha ravishda “something different” bo‘limini ko‘rsatgan."},{"prompt":"What can be inferred about the new section?","choices":["Every visitor enjoyed every suggestion.","It offered discovery without forcing users to participate.","It replaced all familiar recommendations.","It made the website harder to use."],"answer":1,"explanation":"Foydalanuvchilar bo‘limni ochish yoki e’tiborsiz qoldirishni o‘zlari tanlagan."}]},{"t":"Trees and cooler streets","p":"In a hot neighbourhood, a city planted trees along two streets and measured temperatures for a summer. The shaded street was cooler in the afternoon, but the difference was not identical everywhere. Buildings, wind and the age of the trees affected the result. Residents also reported using the shaded pavement more often. The council concluded that tree planting should be planned with local conditions in mind rather than treated as a single solution for every street. It also committed to watering young trees during their first years, when they are most vulnerable to drought.","q":[{"prompt":"What did the city measure?","choices":["The number of cars on each street.","Street temperatures during summer.","The cost of every building.","Residents’ electricity bills."],"answer":1,"explanation":"Shahar yoz davomida ko‘chalardagi haroratni o‘lchagan."},{"prompt":"Why did the temperature difference vary?","choices":["The trees were all artificial.","Local conditions such as buildings and wind differed.","Residents changed the weather.","The council measured only at night."],"answer":1,"explanation":"Bino, shamol va daraxtlarning yoshi natijaga ta’sir qilgan."},{"prompt":"Why will the council water young trees?","choices":["They are more vulnerable to drought.","They produce too much shade.","They grow only in winter.","They change the street’s direction."],"answer":0,"explanation":"Matnda yosh daraxtlar qurg‘oqchilikka eng zaif ekani aytilgan."}]},{"t":"Sleep and study","p":"A college asked volunteers to learn a set of unfamiliar terms and then complete a short recall test. Some students studied late and slept for only a few hours; others stopped earlier and had a full night’s sleep. The second group recalled more terms the next morning. The researchers warned that the project was small and did not prove that sleep alone determines exam results. They suggested that students protect regular sleep while also using active revision. Their practical advice was simple: plan study sessions early enough that last-minute work does not routinely replace rest.","q":[{"prompt":"Which group recalled more terms the next morning?","choices":["The group that slept a full night.","The group that skipped the test.","The group that studied only after midnight.","Both groups recalled none."],"answer":0,"explanation":"To‘liq tun uxlagan guruh ertalab ko‘proq atamani eslagan."},{"prompt":"What limitation did the researchers mention?","choices":["The project was small.","No students took the test.","The terms were already familiar.","The study lasted several years."],"answer":0,"explanation":"Tadqiqot kichik bo‘lgani va uyqu yagona omil ekanini isbotlamagani qayd etilgan."},{"prompt":"What is the passage’s practical advice?","choices":["Replace all revision with sleep.","Plan study early enough to protect rest.","Study only on the night before an exam.","Avoid learning unfamiliar terms."],"answer":1,"explanation":"Tavsiya — o‘qishni oldinroq rejalashtirib, dam olishni saqlash."}]},{"t":"Flexible work, clear goals","p":"A small company let staff choose where to work for two months. Managers first worried that people would communicate less, so each team agreed on shared hours for meetings and wrote down weekly goals. At the end of the trial, most projects were completed on time. Some employees valued the shorter commute, while others preferred the office for collaborative tasks. The company kept the choice but added a monthly team review. The experience suggested that flexibility worked best when expectations were clear and employees could select the setting suited to the task.","q":[{"prompt":"What did teams agree before the trial?","choices":["Shared meeting hours and written goals.","A ban on office meetings.","A shorter working week.","A new company location."],"answer":0,"explanation":"Jamoalar umumiy uchrashuv vaqtlarini belgilab, haftalik maqsadlarni yozib qo‘ygan."},{"prompt":"What happened to most projects?","choices":["They were completed on time.","They were cancelled.","They were moved to another company.","They were never reviewed."],"answer":0,"explanation":"Sinov oxirida loyihalarning aksariyati o‘z vaqtida tugatilgan."},{"prompt":"What helped flexible work succeed?","choices":["Clear expectations and suitable work settings.","Removing all team reviews.","Making every employee work at home.","Giving staff no choice."],"answer":0,"explanation":"Matn mos joy tanlash va aniq kutilmalar muhim bo‘lganini ko‘rsatadi."}]},{"t":"A library beyond books","p":"When a rural library extended its opening hours, the number of visitors rose most on weekday evenings. Some came to borrow books, but others used computers, joined language groups or asked for help completing online forms. The library invited local residents to suggest future activities. In response, it started a weekly repair session where people learned to mend small household items. The librarian said the building had become a place to share practical knowledge, not simply a quiet room for reading. The council continued funding the service after attendance remained steady for six months.","q":[{"prompt":"When did visitor numbers rise most?","choices":["Weekday evenings.","Early Sunday mornings.","During school holidays only.","At lunchtime every day."],"answer":0,"explanation":"Ko‘proq tashrif buyuruvchilar ish kunlari kechqurun kelgan."},{"prompt":"What new activity did residents help introduce?","choices":["A weekly repair session.","A book-selling market.","A private computer course.","A late-night café."],"answer":0,"explanation":"Aholi taklifidan keyin haftalik buyumlarni tuzatish mashg‘uloti boshlangan."},{"prompt":"Why did the council continue funding the library?","choices":["Attendance stayed steady for six months.","It stopped providing books.","The building became a school.","Visitors paid for every service."],"answer":0,"explanation":"Olti oy davomida qatnashuv barqaror qolgani moliyalashtirishni davom ettirishga asos bo‘lgan."}]},{"t":"Restorative justice","p":"A youth court tested a programme in which some young people who had caused damage met trained facilitators and, when appropriate, the people affected. Participants discussed what happened and agreed on practical steps to repair harm. The programme was not offered for every case; officials first checked safety and willingness to take part. After a year, the court reported that many participants completed their agreements, but it did not claim the approach was suitable for serious offences. The report recommended careful screening and continued support rather than replacing the formal justice system.","q":[{"prompt":"What did participants discuss?","choices":["What happened and how to repair the harm.","How to avoid all court rules.","A plan to close the court.","The facilitator’s personal history."],"answer":0,"explanation":"Ular voqeani va zararni qanday tiklash mumkinligini muhokama qilgan."},{"prompt":"Was the programme used for every case?","choices":["No, safety and willingness were checked first.","Yes, every case joined automatically.","Only adults could participate.","It replaced the whole court."],"answer":0,"explanation":"Matnda dastur har bir holatga berilmagani, avval xavfsizlik va rozilik tekshirilgani yozilgan."},{"prompt":"What did the report recommend?","choices":["Careful screening and continued support.","Ending the formal justice system.","Using the programme for every offence.","Removing trained facilitators."],"answer":0,"explanation":"Tavsiya — holatni ehtiyotkor baholash va keyingi yordamni davom ettirish."}]},{"t":"Digital media and local languages","p":"A community radio station began publishing short programmes online in two local languages. Younger listeners shared the recordings with relatives who lived elsewhere, and some older residents contributed stories that had rarely been written down. The station also added subtitles in the national language so that more people could follow the programmes. Staff found that translation took time, so they invited volunteers to review each transcript. The project did not make the languages equally popular overnight, but it created a growing collection of material that families and teachers could use.","q":[{"prompt":"Who contributed stories to the project?","choices":["Some older residents.","Only national politicians.","Tourists visiting the station.","People who could not listen."],"answer":0,"explanation":"Mahalliy katta yoshli aholi ilgari yozilmagan hikoyalarni qo‘shgan."},{"prompt":"Why were subtitles added?","choices":["To help more people follow the programmes.","To remove the local-language recordings.","To shorten every programme.","To prevent volunteers from helping."],"answer":0,"explanation":"Subtitrlar ko‘proq odamlar dasturlarni tushunishi uchun qo‘shilgan."},{"prompt":"What was one outcome of the project?","choices":["A growing collection for families and teachers.","All local languages became equally popular.","Translation was no longer needed.","The radio station stopped broadcasting."],"answer":0,"explanation":"Loyihaning natijasi — oilalar va o‘qituvchilar ishlata oladigan materiallar to‘plami."}]},{"t":"Choosing a route to school","p":"A town encouraged pupils to walk or cycle to school by improving crossings and adding secure bicycle stands. The council compared travel surveys before and after the changes. More families reported walking on days with mild weather, but the overall number of car journeys changed only slightly. Parents said distance and road safety still influenced their choices. The council therefore planned to improve one busy junction and provide supervised walking groups. Officials described the first project as a useful start, not proof that every family could stop driving.","q":[{"prompt":"What did the town improve?","choices":["Crossings and bicycle stands.","School exam results.","The price of public transport.","The length of the school day."],"answer":0,"explanation":"Shahar piyodalar o‘tish joylarini va velosiped turargohlarini yaxshilagan."},{"prompt":"What changed only slightly?","choices":["The overall number of car journeys.","The number of pupils at school.","The length of every crossing.","The weather."],"answer":0,"explanation":"Avtomobilda qilingan safarlar umumiy soni ozgina o‘zgargan."},{"prompt":"Why did the council plan more work?","choices":["Distance and road safety still affected choices.","No families used the new crossings.","Bicycles were prohibited.","The school had moved away."],"answer":0,"explanation":"Masofa va yo‘l xavfsizligi ota-onalar tanloviga hali ham ta’sir qilgan."}]},{"t":"Repair cafes and household costs","p":"A neighbourhood repair café invited volunteers to help residents fix lamps, bicycles and small appliances. Visitors paid nothing, although they could donate towards tools. Organisers expected the main benefit to be lower household costs, but they also recorded fewer items being thrown away. Some repairs were unsuccessful because spare parts were unavailable. The organisers used those cases to build a list of commonly needed parts and contacted local shops. They said the project could not solve every waste problem, yet it helped people gain practical skills and think more carefully before replacing an item.","q":[{"prompt":"What could visitors repair at the café?","choices":["Small household items such as lamps and bicycles.","Large office buildings.","Only new electronic devices.","Public roads."],"answer":0,"explanation":"Ko‘ngillilar chiroq, velosiped va kichik jihozlarni tuzatishga yordam bergan."},{"prompt":"Why were some repairs unsuccessful?","choices":["Spare parts were unavailable.","Visitors were charged too much.","The café had no volunteers.","The items were all new."],"answer":0,"explanation":"Ba’zi ehtiyot qismlar topilmagani sababli ta’mir yakunlanmagan."},{"prompt":"Besides saving money, what benefit did organisers notice?","choices":["Fewer items were thrown away.","Every repair succeeded.","Shops stopped selling parts.","Residents replaced items more quickly."],"answer":0,"explanation":"Kamroq buyum tashlab yuborilgani qayd etilgan."}]},{"t":"Recording family histories","p":"A language group asked teenagers to interview older relatives about work, celebrations and childhood games. The recordings were stored in a small local archive, and each speaker chose whether their interview could be shared publicly. Teachers later used selected clips in lessons about language change. Students noticed that some expressions were understood only within one family, while others appeared in many interviews. The organisers said the project was valuable because it preserved personal memories and encouraged careful listening. They also warned that an archive must respect a speaker’s wishes, including a request to remove a recording.","q":[{"prompt":"What did teenagers record?","choices":["Interviews with older relatives.","Lessons given by professional actors.","Commercial radio adverts.","Only written exam answers."],"answer":0,"explanation":"O‘smirlar katta yoshli qarindoshlari bilan suhbatlarni yozib olgan."},{"prompt":"Who decided whether an interview could be public?","choices":["Each speaker.","The school principal alone.","The town council without consent.","The students’ classmates."],"answer":0,"explanation":"Har bir suhbatdosh yozuvni ochiq ulashish mumkinligini o‘zi tanlagan."},{"prompt":"What must the archive respect?","choices":["A speaker’s request to remove a recording.","A rule to publish every recording.","A ban on teaching language change.","The students’ choice of music."],"answer":0,"explanation":"Arxiv suhbatdoshning yozuvni o‘chirish haqidagi xohishini ham hurmat qilishi kerak."}]},{"t":"Restoring a wetland","p":"A conservation team restored a wetland by blocking several drainage channels and planting native reeds. Before the work, it recorded water levels and counted birds at fixed locations. Two years later, the team observed more nesting activity, but the report cautioned that weather also influenced the counts. Researchers plan to continue monitoring for five years and compare the site with a nearby wetland that was not altered. The project manager said early results were encouraging, while long-term comparisons would provide stronger evidence about which changes had made a difference.","q":[{"prompt":"What did the team record before restoration?","choices":["Water levels and bird numbers.","The price of reeds in shops.","Visitors’ exam scores.","The age of nearby buildings."],"answer":0,"explanation":"Ishdan oldin suv sathi va qushlar soni o‘lchangan."},{"prompt":"Why will the team compare another wetland?","choices":["To get stronger evidence about the changes.","To stop monitoring the restored site.","To move all birds elsewhere.","To avoid recording water levels."],"answer":0,"explanation":"O‘zgartirilmagan joy bilan solishtirish qaysi o‘zgarish natija berganini yaxshiroq ko‘rsatadi."},{"prompt":"How did the manager describe the early results?","choices":["Encouraging, but not yet conclusive.","Proof that weather never matters.","A reason to end the project immediately.","Evidence that no birds returned."],"answer":0,"explanation":"Natijalar umidli, ammo uzoq muddatli dalillar hali kerak."}]}],"wp":[{"task1":"Chiziqli grafik: uchta maktabda kechki kurslarga yozilganlar foizi (2010: 18/25/12; 2015: 27/31/20; 2020: 39/35/29).","task2":"Some people believe schools should focus mainly on subjects that lead directly to employment. Others think a broad education is more valuable. Discuss both views and give your opinion."},{"task1":"Ustunli grafik: ikki turdagi telefon ilovasiga sarflangan haftalik vaqt, 18–25 va 40–55 yosh guruhlarida (soat: 12/8 va 7/5).","task2":"Technology makes communication easier, but some people feel it has reduced the quality of relationships. To what extent do you agree or disagree?"},{"task1":"Jadval: to‘rt hududda qayta ishlangan maishiy chiqindi ulushi (2015: 32/41/24/18%; 2025: 48/56/37/30%).","task2":"Some people think environmental problems can only be solved by governments and large companies. Others believe individuals also have an important role. Discuss both views and give your opinion."},{"task1":"Doiraviy grafik: bir kollej talabalarining kunlik yo‘lga chiqish usullari (avtobus 38%, piyoda 27%, mashina 21%, velosiped 14%).","task2":"Many health problems could be prevented by changes in lifestyle. Should governments do more to encourage people to live healthily?"},{"task1":"Aralash grafik: shahardagi ishga qatnovchilar soni va o‘rtacha safar vaqti, 2000–2020 (ming: 42/55/71; daqiqa: 28/31/35).","task2":"Some employees prefer to work from home, while others believe offices are better for teamwork. Discuss both views and give your opinion."},{"task1":"Jarayon: ishlatilgan qog‘ozni yig‘ish, saralash, maydalash, yuvish va yangi varaqlarga aylantirish bosqichlarini tasvirlang.","task2":"In many countries, family members from different generations live separately. Is this a positive or negative development?"},{"task1":"Xarita: kichik shahar bog‘ining 2005 va 2025-yillardagi rejasi; yangi piyoda yo‘li va bolalar maydonchasini taqqoslang.","task2":"Some people think prison is the best way to reduce crime, while others prefer education and rehabilitation. Discuss both views and give your opinion."},{"task1":"Aralash grafik: kutubxonaga yillik tashriflar va onlayn kitob buyurtmalari (2018–2024). Ko‘rsatkichlar mos ravishda 24–31 ming va 8–22 ming.","task2":"People can now watch films and news from many countries. Do the advantages of this development outweigh the disadvantages?"},{"task1":"Chiziqli grafik: uch shaharda velosiped ulushi (2000: 8/11/5%; 2020: 17/20/12%; 2025: 25/26/18%).","task2":"Some cities should limit private cars and invest more in public transport. To what extent do you agree or disagree?"},{"task1":"Jadval: besh oilaning bir haftadagi oziq-ovqat chiqindisi, kilogrammda (3.2, 2.8, 4.1, 1.9, 3.5).","task2":"Governments have limited budgets. Should they spend more on public services or on economic development?"},{"task1":"Ustunli grafik: muzeyga tashrif buyuruvchilar, mahalliy va xorijiy mehmonlar (2019: 48/22 ming; 2024: 53/39 ming).","task2":"Some people believe schools should protect local languages and traditions. Others think students should focus on international skills. Discuss both views and give your opinion."},{"task1":"Jarayon: mahalliy tarixiy hikoyalarni yozib olish, rozilik olish, arxivlash va darslarda foydalanish bosqichlarini tasvirlang.","task2":"Economic growth can improve living standards but may damage the natural environment. How can societies balance these goals?"}],"ppseed":[["a significant decline in population","the number of people dropped sharply","Sinonim","T/F/NG"],["was widely believed","many people thought","Aktiv-passiv","T/F/NG"],["few researchers disagreed","most researchers agreed","Teskari+inkor","Y/N/NG"],["the cost rose from 5 to 10 euros","the price doubled","Raqam-tavsif","Completion"],["fruits, vegetables and grains","plant-based foods","Konkret-umumiy","Matching info"],["despite the high cost","although it was expensive","Gap tuzilishi","MCQ"]],"cloze":[{"q":"Schools should ____ critical thinking among students.","a":"foster/promote"},{"q":"Many students struggle to ____ a balance between study and work.","a":"strike/maintain"},{"q":"Online courses give people ____ to education.","a":"access"},{"q":"Parents play a key ____ in a child's education.","a":"role"},{"q":"Governments should ____ more money in schools.","a":"invest/spend"},{"q":"Students need to ____ good study habits.","a":"develop/build"},{"q":"Compulsory education helps ____ literacy rates.","a":"raise/improve"},{"q":"Many graduates find it hard to ____ a job.","a":"secure/find"},{"q":"Teachers should ____ attention to individual needs.","a":"pay"},{"q":"Universities should ____ a wide range of courses.","a":"offer"}]};

{t:'Why We Forget, and How to Remember',p:["In 1885 the German psychologist Hermann Ebbinghaus published the results of an unusual experiment: he had spent months memorising lists of meaningless syllables and then testing himself at different intervals. His results revealed what is now called the forgetting curve, a steep loss of information in the first hours after learning, followed by a much slower decline. The finding suggested that forgetting is not a failure of character but a predictable feature of how memory works.","Ebbinghaus also noticed that the way in which he revised mattered as much as how long he spent. Studying the same list repeatedly in a single sitting produced weaker long-term memory than spreading the same number of repetitions over several days. This ‘spacing effect’ has since been confirmed in hundreds of studies, involving everything from foreign vocabulary to medical training, yet it remains surprisingly under-used by students, many of whom prefer to cram before examinations.","One explanation is that cramming feels productive. Material that has just been read seems familiar, and familiarity is easily mistaken for understanding. Psychologists describe this as an ‘illusion of competence’. By contrast, returning to material after a delay is more difficult and less pleasant, because the learner has to work to recall it, but it is precisely this effort that strengthens the memory trace.","A second principle is retrieval practice, sometimes called the testing effect. In a well-known series of experiments, students who read a passage once and then tried to recall it from memory performed better a week later than students who read it several times. Importantly, the first group had believed they would do worse. Testing does not merely measure memory; it changes it.","Sleep also plays a role. During sleep, the brain appears to replay recent experiences, helping to transfer information from short-term storage to more permanent networks. Studies sugge const WEEK1=[{"t": "The Hidden Cost of Cheap Clothing", "wk": 1, "dy": 0, "set": "d0", "p": ["Clothing has never been so cheap. In many wealthy countries, shoppers can buy a T-shirt for less than the price of a sandwich, and the average person now buys far more garments each year than their grandparents did. This trend, often called fast fashion, depends on a simple idea: designs seen on catwalks are copied within weeks, manufactured in large quantities and sold at prices low enough to encourage frequent purchases. Retailers once released new collections four times a year, following the seasons; some now add new items every week. For many customers the result seems entirely positive, since fashionable clothes are no longer a luxury. For the environment, and for the people who make the clothes, however, the picture is considerably less attractive. Many of these clothes are worn only a handful of times.", "The environmental costs begin with the raw materials. Growing cotton requires large quantities of water, and in many regions it also involves heavy use of pesticides. Dyeing and finishing fabrics produces wastewater which, where regulations are weak, may be released into rivers with little treatment. Synthetic fibres such as polyester are cheaper to produce than natural ones, but they shed tiny plastic particles every time they are washed, and these particles eventually find their way into the sea. Researchers who study the industry estimate that clothing is responsible for several per cent of global greenhouse gas emissions, partly because so much manufacturing relies on energy from coal. Transporting finished garments across the world adds further emissions. Water use is a particular concern in dry regions, where cotton farms compete with households for supplies.", "The human costs are equally serious. Most garments are made in countries where wages are low and safety rules are poorly enforced. In 2013 a factory building in Bangladesh collapsed, killing more than a thousand workers and drawing international attention to unsafe conditions and excessive working hours. Since then, a number of brands have signed safety agreements and accepted independent inspections, and conditions in some factories have improved. Nevertheless, campaigners argue that the underlying problem remains: retailers compete by demanding ever-lower prices from their suppliers, which leaves factory owners with little money to pay fair wages or to invest in better equipment. Workers who complain risk losing their jobs, and trade unions are often discouraged.", "Waste is a third problem. Because garments are so inexpensive, many are worn only a few times before being thrown away. Charities report that they receive more donated clothing than they can sell, and large quantities are exported to developing countries, where they can overwhelm local markets and eventually end up in landfill sites. Recycling is technically possible, but separating mixed fibres is difficult and expensive, so only a very small proportion of old clothing is ever turned into new garments. Some designers have experimented with fabrics made from recycled bottles or agricultural waste, yet these materials still account for a tiny share of the market, and their production costs remain high. In effect, the low price of each item hides the much higher cost that society pays later.", "There are, however, signs of change. Some consumers have begun to buy second-hand clothes, rent outfits for special occasions or repair items instead of replacing them. Online resale platforms have grown rapidly in recent years, and several well-known brands now offer repair services in their shops. Governments are also taking an interest: a few European countries are considering laws that would require producers to pay for the collection and recycling of the textiles they sell. Industry representatives, however, warn that such rules could raise prices and reduce choice, and they argue that voluntary agreements are more flexible. Whether either approach will be enough to change habits remains to be seen.", "It would be unrealistic to expect shoppers to abandon inexpensive clothing altogether; for families on low incomes, it is often a necessity rather than a luxury. Nevertheless, the evidence suggests that the current model cannot continue indefinitely. A more sustainable system would probably combine better-made garments, longer use, improved recycling technology and clearer information for buyers about how and where their clothes were produced. Whether people will accept paying slightly more for fewer items is uncertain, but the alternative, a growing mountain of discarded clothing, is hardly an attractive one. Change will almost certainly require action from consumers, producers and governments alike, rather than from any single group."], "q": [{"y": "t", "q": "Shoppers in wealthy countries now buy more clothes each year than their grandparents did.", "a": "T"}, {"y": "t", "q": "Fast-fashion retailers have always released new collections four times a year.", "a": "F"}, {"y": "t", "q": "Synthetic fibres release plastic particles when they are washed.", "a": "T"}, {"y": "t", "q": "Most clothing factories in Bangladesh have been closed since 2013.", "a": "NG"}, {"y": "t", "q": "Charities manage to sell all of the donated clothing they receive.", "a": "F"}, {"y": "n", "q": "The writer accepts that inexpensive clothing is sometimes a necessity for poorer families.", "a": "Y"}, {"y": "n", "q": "The writer thinks the current model of clothing production can last indefinitely.", "a": "N"}, {"y": "n", "q": "The writer believes governments should ban synthetic fibres.", "a": "NG"}, {"y": "n", "q": "The writer is confident that consumers will willingly pay more for fewer items.", "a": "N"}]}, {"t": "How Libraries Have Changed", "wk": 1, "dy": 1, "set": "d1", "p": ["The earliest libraries were not places for ordinary readers. In the ancient world, collections of clay tablets and scrolls were assembled by rulers who wished to store knowledge and to display their power. The royal library at Nineveh, built by an Assyrian king, is thought to have held thousands of tablets covering medicine, astronomy, religion and law, while the great library at Alexandria aimed to gather copies of every important text then known. Access to these collections was limited to scribes, priests and scholars who served the ruler, and most people had neither the education nor the permission to enter. Libraries were, in essence, treasuries of information guarded for the benefit of a powerful few. Even the most generous rulers rarely allowed ordinary subjects to borrow or copy these materials.", "In medieval Europe, the preservation of books passed largely to monasteries. Monks spent many hours copying texts by hand, a slow process which meant that a single volume could take months to produce. Books were therefore extremely valuable, and some libraries chained their most precious volumes to the desks on which they were read, so that no visitor could carry them away. Reading was usually done in silence and in a few designated rooms, and borrowing was rare. Although this system saved many works from being lost, it also ensured that knowledge travelled slowly and remained in the hands of a small religious and educated elite.", "The invention of the printing press in the fifteenth century made books cheaper and more numerous, but it was several centuries before ordinary people could use libraries freely. During the nineteenth century, as literacy increased and cities grew, several countries passed laws allowing local authorities to raise taxes to establish free public libraries. Supporters argued that access to books would help workers improve themselves and reduce social unrest; opponents objected to the cost. Wealthy individuals also played a part, funding the construction of library buildings in towns that could not afford them. Gradually, the idea that reading should be a public right rather than a privilege became widely accepted.", "As collections grew, finding a particular book became a challenge. Early librarians often arranged volumes by size or by the order in which they had been acquired, and only the librarian knew where anything was. In the late nineteenth century, classification systems such as the Dewey Decimal System grouped books by subject and gave each a number, so that readers could locate them without help. Card catalogues, with entries for author, title and subject, made searching still faster. These innovations changed the role of the librarian from guardian of the collection to guide, and they allowed libraries to become open spaces in which visitors could browse the shelves for themselves. Without such systems, a large collection was little more than a pile of books.", "The arrival of the internet led many commentators to predict the end of libraries. Search engines, they argued, could answer questions faster than any catalogue, and electronic books could be downloaded at home. In fact, the picture has proved more complicated. Although the number of books borrowed has fallen in some places, visits to libraries have remained high, because people use them to access computers, to study quietly, to attend classes and to meet others. Libraries have also begun to lend e-books and to subscribe to expensive academic databases that individual readers could not afford, so that digital resources have become part of their service rather than a replacement for it.", "Today libraries are increasingly seen as community centres. Many offer training in digital skills, host events for children, and provide support for people looking for work or learning a new language. Yet this broader role comes at a time when budgets are under pressure, and in several countries local libraries have been closed or have had their opening hours reduced. Defenders argue that the benefits of libraries are difficult to measure in money, since they affect education, health and social contact, whereas critics question whether public funds should support services that many residents rarely use. The debate suggests that the future of libraries will depend as much on political choices as on technology. Some libraries have responded by lending tools, seeds and musical instruments, which suggests how far their purpose has widened."], "h": ["Knowledge kept for the powerful few", "The slow work of copying by hand", "Reading becomes a public right", "Making books easier to find", "Libraries and the internet", "A new role in the community", "The decline of reading among young people"], "q": [{"y": "h", "q": "Paragraph B", "a": 1}, {"y": "h", "q": "Paragraph C", "a": 2}, {"y": "h", "q": "Paragraph D", "a": 3}, {"y": "h", "q": "Paragraph E", "a": 4}, {"y": "h", "q": "Paragraph F", "a": 5}, {"y": "i", "q": "a mention of a system that allowed readers to find books without assistance", "a": 3}, {"y": "i", "q": "an explanation of why certain books were physically secured", "a": 1}, {"y": "i", "q": "a reference to laws that let local authorities pay for libraries", "a": 2}, {"y": "i", "q": "a description of a prediction that libraries would disappear", "a": 4}]}, {"t": "Coral Reefs: Cities of the Sea", "wk": 1, "dy": 2, "set": "d2", "p": ["Coral reefs cover less than one per cent of the ocean floor, yet they support roughly a quarter of all marine species. Often described as the rainforests of the sea, they are built by tiny animals called polyps, which extract calcium from seawater to form hard skeletons. Over thousands of years, the skeletons of countless generations accumulate to create vast structures, such as the Great Barrier Reef off the coast of Australia, which can be seen from space. The reef itself is therefore a kind of living architecture, with the oldest layers lying beneath a thin surface of living coral that grows only a few millimetres or centimetres each year. Because corals are animals rather than plants, they must also capture food from the water, using stinging tentacles to catch plankton at night.", "Most reef-building corals depend on a partnership with microscopic algae called zooxanthellae, which live inside the coral’s tissue. The algae use sunlight to produce sugars, a large proportion of which pass to the coral, while the coral provides the algae with shelter and certain nutrients. This arrangement explains why reefs are found mainly in warm, clear, shallow water where sunlight can penetrate, and why they thrive in seas that are otherwise poor in nutrients. It also explains why the partnership is so fragile: because each partner depends on the other, a disturbance that harms one quickly affects both, and the whole structure may be put at risk.", "The most visible symptom of this fragility is coral bleaching. When the water becomes unusually warm for several weeks, the corals expel their algae, lose their colour and turn white. A bleached coral is not necessarily dead, and if temperatures fall quickly it may recover, but it is weakened and more vulnerable to disease. Repeated episodes allow little time for recovery. In recent decades, major bleaching events have affected reefs on every continent with tropical coasts, and scientists believe that rising ocean temperatures linked to climate change are the main cause. Pollution, overfishing and the acidification of seawater add further pressure, making the damage harder to reverse.", "The loss of reefs would affect far more than marine life. Reefs act as natural barriers which reduce the force of waves before they reach the coast, protecting millions of people in low-lying areas from storms and erosion. They are also a source of food for coastal communities, since many commercially important fish spend part of their lives among the coral. In addition, reefs attract tourists whose spending provides income for diving centres, hotels and local guides. In some small island nations, tourism linked to reefs accounts for a substantial part of national income, so that the health of the reef is directly connected to the health of the economy. Healthy reefs also help to maintain the beaches on which many resorts depend, because broken coral is gradually ground into sand.", "Conservationists have responded with a range of measures. Marine protected areas, where fishing and other activities are restricted, give damaged reefs the opportunity to recover. Programmes to reduce pollution from farms and towns improve water quality, and some tourist operators now teach visitors not to touch the coral or to use sunscreens that are less harmful. A newer approach is active restoration: scientists collect small fragments of healthy coral, grow them in underwater nurseries and then attach them to damaged areas. Some researchers are also trying to breed varieties that tolerate higher temperatures, although the idea remains controversial because of uncertainty about its long-term effects. Local communities are sometimes employed as reef rangers, which gives them an income from protecting the very resource they once fished.", "How much these efforts can achieve is uncertain. Restoration projects are labour-intensive and expensive, and they can currently cover only very small areas compared with the size of the world’s reefs. Most experts therefore argue that planting coral can never be more than a supplement to the more fundamental task of limiting global warming. Even so, local measures are valuable, because healthy reefs with clean water and abundant fish seem better able to withstand heat stress than those that are already damaged. In this sense, protecting reefs today may help to keep options open while the world decides how rapidly it will reduce its emissions."], "q": [{"y": "s", "q": "Coral reefs cover less than one per cent of the ocean floor but support about a quarter of all ______.", "a": "marine species"}, {"y": "s", "q": "The microscopic algae that live inside coral tissue are called ______.", "a": "zooxanthellae"}, {"y": "s", "q": "When the water stays too warm, corals expel their algae, a process known as ______.", "a": "bleaching|coral bleaching"}, {"y": "s", "q": "Reefs reduce the force of ______ before they reach the coast.", "a": "waves"}, {"y": "s", "q": "Scientists grow small coral fragments in underwater ______ before attaching them to damaged areas.", "a": "nurseries"}, {"y": "m", "q": "What is the main point of paragraph B?", "o": ["Algae are more important than coral.", "Coral and algae depend on each other, which makes reefs fragile.", "Reefs grow best in nutrient-rich water.", "Coral produces sugars that are eaten by fish."], "a": 1}, {"y": "m", "q": "According to paragraph C, a bleached coral", "o": ["is always dead.", "may recover if temperatures fall quickly.", "is protected from disease.", "no longer needs sunlight."], "a": 1}, {"y": "m", "q": "The writer mentions small island nations in paragraph D to show that", "o": ["tourism is harmful to reefs.", "the health of a reef can affect a national economy.", "island nations have the healthiest reefs.", "fishing is more valuable than tourism."], "a": 1}, {"y": "m", "q": "What is the writer’s view of coral restoration in the final paragraph?", "o": ["It is unnecessary.", "It can solve the problem on its own.", "It is useful but cannot replace limiting global warming.", "It is cheaper than reducing emissions."], "a": 2}]}, {"t": "Wolves and the Yellowstone Ecosystem", "wk": 1, "dy": 3, "set": "mix", "p": ["Gray wolves once ranged across most of North America, but by the early twentieth century their numbers had fallen sharply. Settlers who raised cattle and sheep regarded the animals as a threat to their livelihoods, and governments paid bounties for dead wolves. In Yellowstone National Park, which had been established in 1872 to protect its natural features, official policy also favoured the removal of predators, on the assumption that the park’s more appealing species would benefit. By the 1920s wolves had been eliminated from the park, and for roughly seventy years it had no resident wolf packs. Few people at the time doubted that this was a sensible decision. Public attitudes towards predators began to change only after the middle of the century, when scientists and conservation groups started to argue that every species played some part in the health of its habitat.", "The consequences of this absence were not immediately obvious, but over the following decades many biologists came to believe that the park’s ecosystem had become unbalanced. Without wolves to hunt them, elk herds grew larger and spent long periods grazing along rivers and streams, where they ate the young shoots of willow and aspen trees. As these trees failed to regenerate, riverbanks became more exposed to erosion, and animals that depended on the trees, such as beavers and certain songbirds, became less common. Park managers tried to control elk numbers by shooting some of the animals, but the programme was unpopular and had limited effect.", "In the early 1990s, after years of argument, the United States government approved a plan to bring wolves back. In 1995 and 1996, a total of thirty-one wolves captured in Canada were released into the park. The decision was bitterly opposed by many ranchers in the surrounding region, who feared that wolves would kill their livestock and that restrictions designed to protect the animals would limit the use of land. Supporters, including many scientists, argued that restoring the wolf would repair the damage caused by earlier policies and bring benefits for tourism. A compensation scheme was eventually set up so that ranchers could claim payment for animals killed by wolves.", "The wolves multiplied quickly, and within a decade the park held roughly a hundred of them. Elk numbers fell, partly because of predation and partly because the animals changed their behaviour: instead of lingering in open river valleys, where they were easy to attack, they moved more frequently and avoided some of the most dangerous areas. In several places, willows and aspens began to recover, providing food and building material for beavers, whose dams created ponds used by fish, amphibians and waterbirds. Ecologists use the term trophic cascade to describe this kind of chain reaction, in which a change at the top of the food web spreads downwards through many other species. Park rangers also reported that some bird species, including songbirds that nest in willow thickets, became more common as the vegetation along the streams recovered.", "The story has been retold in books and films as a dramatic example of how a single species can transform a landscape. More recent research, however, suggests that it is less straightforward. Elk numbers were already declining before the wolves returned, partly because of hunting outside the park and a series of dry years, and bears and cougars also prey on elk. In some areas, the recovery of willows has been patchy or has depended mainly on rainfall and the level of groundwater. Several scientists therefore argue that popular accounts have exaggerated the wolf’s influence, while others maintain that the evidence for at least some cascading effects remains strong.", "Whatever the final verdict, the Yellowstone experience has taught conservationists several lessons. It shows how closely species in an ecosystem are connected, even if the effects of removing or restoring one of them may be smaller or slower than first assumed. It also demonstrates that reintroductions succeed best when local communities are consulted and when the results are monitored carefully over many years, rather than judged on the basis of early success. Finally, it reminds us that the ecosystems we inherit have been shaped by human decisions, and that repairing them requires patience, careful research and a willingness to revise our assumptions."], "h": ["A divisive decision to bring wolves back", "Why elk herds grew unchecked", "Scientists disagree about the wolves’ role", "The long history of hunting wolves", "Lessons for conservation planning"], "q": [{"y": "t", "q": "Wolves had disappeared from Yellowstone by the end of the 1920s.", "a": "T"}, {"y": "t", "q": "Elk numbers rose immediately after wolves were reintroduced.", "a": "F"}, {"y": "t", "q": "The wolf population in Yellowstone has now reached its maximum size.", "a": "NG"}, {"y": "n", "q": "The writer thinks the effects of restoring a species may be smaller or slower than first assumed.", "a": "Y"}, {"y": "n", "q": "The writer believes ranchers should be allowed to hunt wolves again.", "a": "NG"}, {"y": "h", "q": "Paragraph C", "a": 0}, {"y": "h", "q": "Paragraph E", "a": 2}, {"y": "i", "q": "a reference to changes in the behaviour of grazing animals", "a": 3}, {"y": "i", "q": "an explanation of why ranchers opposed the project", "a": 2}, {"y": "s", "q": "The wolves released in 1995 and 1996 had been captured in ______.", "a": "Canada"}, {"y": "s", "q": "Ecologists use the term ______ for a chain reaction that spreads down through the food web.", "a": "trophic cascade"}, {"y": "m", "q": "According to paragraph B, what happened to young willows and aspens after the wolves disappeared?", "o": ["They grew more quickly.", "They often failed to regenerate because elk ate them.", "They were removed by park managers.", "They were replaced by other species."], "a": 1}, {"y": "m", "q": "What is the main message of the final paragraph?", "o": ["Reintroductions should be avoided.", "Restoring ecosystems requires careful, long-term work and consultation.", "Local communities should decide park policy alone.", "Early success proves that a project is effective."], "a": 1}]}, {"t": "Farming Upwards: The Promise of Vertical Farms", "wk": 1, "dy": 4, "set": "mix", "p": ["Agriculture is one of humanity’s greatest consumers of resources. Farming occupies roughly half of the world’s habitable land and accounts for the majority of the fresh water that people withdraw from rivers, lakes and underground reserves. As the global population grows and more people move to cities, there is increasing pressure to produce more food on less land, while also reducing the environmental damage caused by fertilisers, pesticides and long-distance transport. One idea that has attracted considerable investment and publicity in recent years is the vertical farm: a building in which crops are grown in stacked layers, often in the middle of a city, without sunlight or soil. Supporters describe it as a way of bringing farming closer to the people it feeds.", "The technology that makes this possible has three main parts. First, plants receive light from energy-efficient LED lamps, which can be adjusted to supply the particular colours of light that crops use most effectively. Second, instead of growing in soil, plants are supported in trays with their roots in a nutrient solution, a method known as hydroponics; in a variant called aeroponics, the roots hang in the air and are sprayed with a fine mist. Third, computer systems monitor temperature, humidity and levels of carbon dioxide, adjusting them continuously so that conditions remain ideal whatever the weather outside. Because these conditions never change, crops can be harvested throughout the year and in many cycles.", "Supporters claim a number of advantages. Because the water in a hydroponic system is recycled, a vertical farm may use only a small fraction of the water needed to grow the same crop in a field. The sealed environment keeps pests out, so growers do not need to apply pesticides, and the absence of soil means there is no runoff polluting nearby rivers. Locating farms close to the customers who buy their produce reduces the distance that food must travel, which lowers transport emissions and means that delicate vegetables reach shops within hours of being picked. In regions with harsh climates, such as deserts or the far north, vertical farms could also allow fresh produce to be grown locally rather than imported.", "The difficulties, however, are considerable. The most serious is energy. Artificial lighting and climate control require large amounts of electricity, and in many farms electricity represents the largest single cost. If that electricity is generated from fossil fuels, the emissions from a vertical farm may exceed those of a conventional farm, cancelling out the savings in water and transport. Buildings fitted with lighting, pumps and sensors are also expensive to construct, and several well-known companies have closed or been forced to restructure after failing to make a profit. Critics argue that some of the publicity surrounding the technology has been exaggerated, and that investors have sometimes been attracted by promises that the farms could not realistically keep.", "Another limitation concerns what can be grown. At present vertical farms concentrate on crops that are light, quick to mature and valuable by weight, such as salad leaves, herbs and some soft fruit like strawberries. Staple foods, including wheat, rice and potatoes, supply most of the world’s calories, but they need far more light and space and sell at low prices, so growing them indoors is not economically realistic. A few researchers are developing dwarf varieties that could be cultivated in compact layers, and others are testing ways of using cheaper light, but these ideas remain at an early stage. For the foreseeable future, vertical farms are therefore likely to supplement, rather than replace, traditional agriculture.", "The most realistic role for vertical farming may be a specialised one. It makes the most sense in places where land is scarce, the climate is extreme or imported vegetables are expensive, and where electricity is cheap and increasingly generated from renewable sources. Advances in automation and in the efficiency of lighting may gradually reduce costs, and the technology could also be useful for producing plants for medicine or research. Nevertheless, anyone who expects vertical farms to solve the problem of feeding the world is likely to be disappointed. They are best seen as one tool among many, valuable in the right circumstances but not a substitute for improvements in conventional farming."], "h": ["How artificial farms are controlled", "Claimed benefits for water and land", "Why only some crops make sense", "Rising demand for fresh produce", "A realistic role for the future"], "q": [{"y": "t", "q": "Vertical farms grow crops in stacked layers inside buildings.", "a": "T"}, {"y": "t", "q": "Plants in vertical farms are grown in soil enriched with nutrients.", "a": "F"}, {"y": "t", "q": "Vertical farms in the Middle East are more profitable than those in Europe.", "a": "NG"}, {"y": "n", "q": "The writer believes vertical farms are likely to replace traditional agriculture.", "a": "N"}, {"y": "n", "q": "The writer thinks the cost of electricity is a serious problem for vertical farms.", "a": "Y"}, {"y": "h", "q": "Paragraph C", "a": 1}, {"y": "h", "q": "Paragraph E", "a": 2}, {"y": "i", "q": "a reference to companies that failed to make a profit", "a": 3}, {"y": "i", "q": "a description of how plants receive nutrients without soil", "a": 1}, {"y": "s", "q": "In hydroponic systems, the roots of plants are placed in a nutrient ______.", "a": "solution"}, {"y": "s", "q": "Because the farms are sealed, growers do not need to apply ______.", "a": "pesticides"}, {"y": "m", "q": "According to paragraph D, why might a vertical farm produce more emissions than a conventional farm?", "o": ["It uses too much water.", "It relies on electricity generated from fossil fuels.", "It transports food further.", "It needs larger buildings."], "a": 1}, {"y": "m", "q": "What does the writer conclude about vertical farms?", "o": ["They are a complete solution to hunger.", "They should be closed.", "They are likely to play a supporting role.", "They are only suitable for deserts."], "a": 2}]}, {"t": "Why Languages Disappear", "wk": 1, "dy": 6, "set": "mix", "p": ["There are around seven thousand languages spoken in the world today, but they are distributed very unevenly. A small number of languages, such as Mandarin, Spanish and English, are spoken by billions of people, while thousands of others are spoken by only a few hundred or a few thousand. In many cases, the speakers of the smallest languages live in a single valley or on a single island. Linguists who monitor the situation estimate that perhaps half of the world’s languages could disappear by the end of this century, which would mean the loss of roughly one language every few months. Such predictions are uncertain, because it is difficult to count speakers accurately in remote regions, yet most specialists agree that the overall trend is clear and worrying.", "It is a common mistake to assume that languages are usually destroyed by force. Although some governments have banned minority languages in schools or punished children for speaking them, the more frequent causes are economic and social. Parents who live in poor communities often decide, quite reasonably, to encourage their children to learn a language that will offer better employment prospects. Schools and the media tend to use a national or international language, and radio, television and, more recently, the internet have strengthened the position of a few dominant tongues. The movement of people from villages to cities exposes them to speakers of other languages, so that the home language gradually becomes confined to a few situations. In some communities, speakers have also been taught to regard their language as backward, which weakens their pride in it.", "The critical moment arrives when children stop learning the language at home. A language can survive for many decades after this point, because the older generations continue to speak it at gatherings and in daily conversation, and observers may not realise that anything is wrong. But when the last generation of fluent speakers dies, there is no one to pass the language on. Linguists therefore pay particular attention to the age of speakers rather than their total number: a language with ten thousand elderly speakers and no young ones may be in greater danger than a language with a thousand speakers of all ages. Once transmission has stopped, reversing the process becomes extremely difficult.", "The disappearance of a language is more than the loss of a means of communication. Every language contains a community’s accumulated knowledge about its environment, including the names and uses of plants and animals, ways of navigating, traditional medicine and oral histories that may not have been written down anywhere else. For researchers, each language also provides evidence about the range of structures that the human mind can produce, and when a language is lost, part of this evidence disappears for ever. For its speakers, a language is often a central part of their identity. A minority of commentators nevertheless argue that fewer languages would make communication easier and that the loss is a natural result of social change.", "In recent decades a number of communities have tried to reverse the decline. In New Zealand, the Māori language, which had been spoken by fewer and fewer children, began to recover after the establishment in the early 1980s of preschools known as language nests, in which very young children are cared for entirely in Māori by fluent elders. Similar immersion programmes have been created for Hawaiian, and Welsh has benefited from its use in schools and broadcasting. Technology has also helped: recordings, online dictionaries and smartphone applications allow learners to practise even when no teacher is nearby. Success, however, has varied, and it is always costly and slow, since it requires committed teachers, funding and, above all, a community willing to use the language in daily life.", "Not every endangered language can be saved, and it would be unrealistic to pretend otherwise. Where speakers have already shifted to another language, outsiders cannot impose a revival upon them. Nevertheless, there is a strong case for documenting languages before they disappear and for supporting communities that wish to keep their languages alive. Governments can help by recognising minority languages officially and by training teachers. The decisive factor is the motivation of the speakers themselves: projects that are led by local people, and that make the language useful in education, work and entertainment, have far more chance of lasting than those directed from outside."], "h": ["A world of unequal languages", "Economic and social pressures", "The moment transmission stops", "What is lost with a language", "Efforts to bring languages back"], "q": [{"y": "t", "q": "Most of the world’s languages have large numbers of speakers.", "a": "F"}, {"y": "t", "q": "Language loss is usually caused by direct government bans.", "a": "F"}, {"y": "t", "q": "Language nests for the Māori language were established in the early 1980s.", "a": "T"}, {"y": "n", "q": "The writer believes that every endangered language can be saved.", "a": "N"}, {"y": "n", "q": "The writer thinks the motivation of the speakers is the decisive factor in revival.", "a": "Y"}, {"y": "h", "q": "Paragraph C", "a": 2}, {"y": "h", "q": "Paragraph E", "a": 4}, {"y": "i", "q": "a reference to knowledge about plants stored in a language", "a": 3}, {"y": "i", "q": "a mention of children no longer learning a language at home", "a": 2}, {"y": "s", "q": "Linguists estimate that perhaps ______ of the world’s languages could disappear by the end of this century.", "a": "half"}, {"y": "s", "q": "Parents often choose languages that offer better ______.", "a": "employment prospects|job prospects"}, {"y": "m", "q": "Why may a language be in danger even if elderly people still speak it?", "o": ["Elderly speakers forget it.", "Young people no longer learn it at home.", "Governments forbid its use.", "It has too many dialects."], "a": 1}, {"y": "m", "q": "What is the writer’s attitude towards revival projects?", "o": ["They always fail.", "They are only worth supporting if outsiders lead them.", "They deserve support when the speakers themselves are motivated.", "They are cheap and quick to carry out."], "a": 2}]}];RP.push(...WEEK1);
